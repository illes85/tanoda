<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1a14" media="(prefers-color-scheme:dark)">
<meta name="theme-color" content="#f2f8f4" media="(prefers-color-scheme:light)">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/ikon.svg">
<title>Tanoda</title>
<style>
:root{--bg:#0e1a14;--kartya:#17281f;--kartya2:#1f3629;--vonal:#2b4a39;--szoveg:#eaf5ee;--halvany:#93b0a0;--zold:#2fd16b;--zold2:#1fa653;--arany:#ffc83d;--piros:#ff5d5d;--kek:#5db8ff;--jo-bg:#143d25;--rossz-bg:#3d1818;--be-bg:#1b4a2e;--ki-bg:#14283a;--vesz-bg:#3a1d1d;--vesz-sz:#ffb0b0;--vesz-v:#5a2a2a;--gomb-sz:#06210f;--arany-sz:#3a2800;--hiba-sz:#ffb0b0;color-scheme:dark}
@media (prefers-color-scheme:light){:root{--bg:#f2f8f4;--kartya:#ffffff;--kartya2:#e6f1ea;--vonal:#c5d9cc;--szoveg:#14281d;--halvany:#5b7567;--zold:#22b85c;--zold2:#17924a;--arany:#f5b400;--piros:#e0443e;--kek:#1f78c8;--jo-bg:#dcf5e5;--rossz-bg:#fde3e1;--be-bg:#d2f0de;--ki-bg:#dcebfa;--vesz-bg:#fde3e1;--vesz-sz:#a3231e;--vesz-v:#f0b9b5;--hiba-sz:#a3231e;color-scheme:light}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--szoveg);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:760px;margin:0 auto;padding:14px 14px 80px}
h1,h2,h3{margin:.2em 0}
button{font:inherit;color:inherit;cursor:pointer}
.gomb{background:var(--zold);color:var(--gomb-sz);border:0;border-bottom:4px solid var(--zold2);border-radius:14px;padding:13px 18px;font-weight:800;width:100%;font-size:1.02rem;letter-spacing:.3px}
.gomb:active{transform:translateY(2px);border-bottom-width:2px}
.gomb.masodlagos{background:var(--kartya2);color:var(--szoveg);border-bottom-color:var(--vonal)}
.gomb.veszely{background:var(--vesz-bg);color:var(--vesz-sz);border-bottom-color:var(--vesz-v)}
.gomb[disabled]{opacity:.45;pointer-events:none}
.kartya{background:var(--kartya);border:1px solid var(--vonal);border-radius:18px;padding:14px;margin:12px 0}
.sor{display:flex;align-items:center;gap:10px}
.rug{flex:1}
.halvany{color:var(--halvany);font-size:.9rem}
.fejlec{position:sticky;top:0;background:linear-gradient(var(--bg) 85%,transparent);padding:8px 0 12px;z-index:5}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--kartya2);border-radius:999px;padding:6px 12px;font-weight:700}
.sav{height:12px;background:var(--kartya2);border-radius:99px;overflow:hidden}
.sav>i{display:block;height:100%;background:linear-gradient(90deg,var(--zold),#8bf0b0);border-radius:99px;transition:width .5s}
.sav.arany>i{background:linear-gradient(90deg,var(--arany),#ffe38a)}
.gyuru{--p:0;width:54px;height:54px;border-radius:50%;background:conic-gradient(var(--zold) calc(var(--p)*1%),var(--kartya2) 0);display:grid;place-items:center;flex:none}
.gyuru>b{width:42px;height:42px;border-radius:50%;background:var(--kartya);display:grid;place-items:center;font-size:.8rem}
input,textarea,select{width:100%;background:var(--kartya2);border:2px solid var(--vonal);border-radius:12px;color:var(--szoveg);padding:12px;font:inherit}
input:focus,textarea:focus{outline:none;border-color:var(--zold)}
label{display:block;margin:12px 0 5px;font-weight:700}
.chipsor{display:flex;flex-wrap:wrap;gap:8px}
.valaszt{background:var(--kartya2);border:2px solid var(--vonal);border-radius:12px;padding:9px 14px;font-weight:700}
.valaszt.be{border-color:var(--zold);background:var(--be-bg)}
.modul{margin:14px 0 6px;font-weight:800}
.lecke{display:flex;gap:10px;align-items:center;padding:10px;border-radius:12px;background:var(--kartya);margin:6px 0;border:1px solid var(--vonal)}
.lecke.kesz{opacity:.7}.lecke.mai{border-color:var(--zold);box-shadow:0 0 0 2px color-mix(in srgb,var(--zold) 25%,transparent)}
.pont{width:28px;height:28px;border-radius:50%;background:var(--kartya2);display:grid;place-items:center;flex:none;font-size:.85rem}
.lecke.kesz .pont{background:var(--zold);color:var(--gomb-sz)}
.fulek{display:flex;gap:6px;margin:10px 0}
.ful{flex:1;padding:10px;border-radius:12px;background:var(--kartya);border:1px solid var(--vonal);text-align:center;font-weight:700}
.ful.be{background:var(--kartya2);border-color:var(--zold)}
a{color:var(--kek)}
.md em{font-style:normal;font-weight:700;color:var(--kek);background:color-mix(in srgb,var(--kek) 12%,transparent);padding:0 5px;border-radius:6px}
.md p{margin:.5em 0}.md ul{margin:.4em 0 .4em 1.1em;padding:0}
/* lecke-lejátszó */
#lj{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#lj .tet{display:flex;align-items:center;gap:12px;padding:12px 14px}
#lj .tet .sav{flex:1}
#lj .x{background:none;border:0;font-size:1.5rem;color:var(--halvany)}
#lj .test{flex:1;overflow:auto;padding:6px 16px 16px;max-width:760px;width:100%;margin:0 auto}
#lj .lab{padding:12px 16px 16px;max-width:760px;width:100%;margin:0 auto}
.kerdes{font-size:1.25rem;font-weight:800;margin:10px 0 16px}
.opcio{display:block;width:100%;text-align:left;background:var(--kartya);border:2px solid var(--vonal);border-bottom-width:4px;border-radius:14px;padding:13px 14px;margin:9px 0;font-weight:600}
.sor .opcio{flex:1;width:auto}.idosav{height:10px;background:var(--vonal);border-radius:6px;overflow:hidden;margin:10px 0}.idosav i{display:block;height:100%;width:100%;background:var(--zold);border-radius:6px}.idosav.sur i{background:var(--piros)}
.kitolt{font-size:1.25rem;font-weight:700;margin:14px 0;text-align:center}.lyuk{display:inline-block;min-width:70px;border-bottom:3px solid var(--arany);margin:0 4px;padding:0 6px}.lyuk.jo{color:var(--zold);border-color:var(--zold)}.lyuk.rossz{color:var(--piros);border-color:var(--piros)}
.szavak{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0}.szochip{background:var(--kartya);border:2px solid var(--vonal);border-bottom-width:4px;border-radius:12px;padding:10px 13px;font-size:1.1rem;font-weight:700}.szochip.jo{border-color:var(--zold);background:rgba(47,209,107,.18)}.szochip.rossz{border-color:var(--piros)}
.opcio.jo{border-color:var(--zold);background:var(--jo-bg)}.opcio.rossz{border-color:var(--piros);background:var(--rossz-bg)}
.vissza{border-radius:16px;padding:14px;margin-top:14px;font-weight:600}
.vissza.jo{background:var(--jo-bg);border:1px solid var(--zold)}.vissza.rossz{background:var(--rossz-bg);border:1px solid var(--piros)}
.flip{background:var(--kartya);border:2px solid var(--vonal);border-radius:20px;min-height:170px;display:grid;place-items:center;padding:20px;text-align:center;font-size:1.35rem;font-weight:800}
.pardoboz{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.par{background:var(--kartya);border:2px solid var(--vonal);border-bottom-width:4px;border-radius:12px;padding:12px;text-align:center;font-weight:600}
.par.ki{border-color:var(--kek);background:var(--ki-bg)}.par.kesz{visibility:hidden}.par.hiba{animation:remeg .35s;border-color:var(--piros)}
.szo{display:inline-block;background:var(--kartya);border:2px solid var(--vonal);border-bottom-width:4px;border-radius:10px;padding:8px 12px;margin:4px;font-weight:700}
.szohely{min-height:56px;border-bottom:2px dashed var(--vonal);margin-bottom:12px;padding:4px 0}
.hang{width:84px;height:84px;border-radius:50%;background:var(--kek);color:#fff;border:0;font-size:2rem;display:block;margin:10px auto 18px;border-bottom:5px solid rgba(0,0,0,.25)}
.kombo{position:fixed;right:14px;top:70px;background:var(--arany);color:var(--arany-sz);font-weight:900;border-radius:99px;padding:5px 12px;animation:pop .3s}
@keyframes remeg{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
@keyframes pop{0%{transform:scale(.4)}70%{transform:scale(1.2)}100%{transform:scale(1)}}
@keyframes lebeg{50%{transform:translateY(-6px)}}
.nagy{font-size:4rem;text-align:center;animation:lebeg 1.6s infinite}
#app>div,#app>h2,#app>label{}
.kozep{text-align:center}
.kituzo{display:inline-grid;place-items:center;width:78px;margin:6px;text-align:center;font-size:.72rem}
.kituzo b{font-size:2rem;display:block}.kituzo.nincs{filter:grayscale(1);opacity:.35}
#konfetti{position:fixed;inset:0;pointer-events:none;z-index:40}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--kartya2);border:1px solid var(--zold);padding:10px 16px;border-radius:14px;z-index:50;max-width:90%}

/* ---------- animációk, kabala ---------- */
.csira .szem,.csira .level,.csira .szaj-ny,.csira .test2{transform-box:fill-box}
@keyframes belep{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop2{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.06)}100%{transform:scale(1);opacity:1}}
@keyframes ugras{0%{transform:translateY(0) scale(1,1)}15%{transform:translateY(0) scale(1.12,.86)}45%{transform:translateY(-26px) scale(.92,1.1)}75%{transform:translateY(0) scale(1.1,.88)}100%{transform:none}}
@keyframes lebeg2{50%{transform:translateY(-4px)}}
@keyframes remeg2{20%{transform:translateX(-5px) rotate(-3deg)}50%{transform:translateX(5px) rotate(3deg)}80%{transform:translateX(-3px)}}
@keyframes lengo{50%{transform:rotate(6deg)}}
@keyframes pislog{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes szaj{50%{transform:scaleY(1.7)}}
@keyframes lang{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.18) rotate(4deg)}}
@keyframes csillog{to{background-position:-60px 0}}
@keyframes repul{0%{transform:translate(0,0) scale(.4);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--r));opacity:0}}
@keyframes zz{0%{transform:translate(0,0);opacity:0}30%{opacity:1}100%{transform:translate(10px,-22px);opacity:0}}
@keyframes jopuls{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--zold) 60%,transparent)}100%{box-shadow:0 0 0 14px transparent}}
@keyframes forog{from{transform:rotate(-15deg) scale(.3)}to{transform:none}}
.be-anim>*{animation:belep .38s both}.be-anim>*:nth-child(2){animation-delay:.05s}.be-anim>*:nth-child(3){animation-delay:.1s}.be-anim>*:nth-child(4){animation-delay:.15s}.be-anim>*:nth-child(n+5){animation-delay:.2s}
.kartya{animation:pop2 .4s both}
#app .kartya:nth-of-type(2){animation-delay:.06s}#app .kartya:nth-of-type(3){animation-delay:.12s}
.sav>i{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 10px,transparent 10px 20px);background-size:60px 60px;animation:csillog 1.4s linear infinite}
.opcio,.par,.szo,.valaszt,.lecke{transition:transform .12s,border-color .15s,background .15s}
.opcio:active,.par:active,.szo:active{transform:scale(.97)}
.opcio.jo{animation:jopuls .6s,ugras .5s}.opcio.rossz{animation:remeg2 .4s}
.vissza{animation:pop2 .35s both}
.lang{display:inline-block;animation:lang 1.6s ease-in-out infinite;transform-origin:50% 80%}
.kituzo b{display:block;animation:forog .6s both}
.gomb{position:relative;overflow:hidden}
.gomb::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-120%);transition:none}
.gomb:hover::after{transform:translateX(120%);transition:transform .6s}
.csirasor{display:flex;align-items:center;gap:10px;padding:0 16px;max-width:760px;width:100%;margin:0 auto}
.csira{width:108px;height:108px;flex:none;position:relative}
.csira.nagy2{width:210px;height:210px;margin:0 auto}
.csira svg{width:100%;height:100%;overflow:visible;visibility:hidden}
html.k3d-nincs .csira svg{visibility:visible}   /* a csíra csak akkor látszik, ha a 3D kabala nem indul – betöltéskor ne villanjon fel */
.csira .test2{transform-origin:50% 90%;animation:lebeg2 3s ease-in-out infinite}
.csira .level{transform-origin:50% 100%;animation:lengo 3.4s ease-in-out infinite}
.csira .szem{transform-origin:50% 50%;animation:pislog 4.5s infinite}
.csira .szem-orul,.csira .szem-szomoru,.csira .szem-alszik,.csira .szaj-ny,.csira .szaj-szomoru,.csira .szaj-orul,.csira .zzz,.csira .gondol{display:none}
.csira[data-a=orul] .test2{animation:ugras .7s}
.csira[data-a=orul] .szem,.csira[data-a=szomoru] .szem,.csira[data-a=alszik] .szem{display:none}
.csira[data-a=orul] .szem-orul,.csira[data-a=orul] .szaj-orul{display:inline}
.csira[data-a=orul] .szaj{display:none}
.csira[data-a=szomoru] .test2{animation:remeg2 .5s}
.csira[data-a=szomoru] .szem-szomoru,.csira[data-a=szomoru] .szaj-szomoru{display:inline}
.csira[data-a=szomoru] .szaj{display:none}
.csira[data-a=beszel] .szaj{display:none}.csira[data-a=beszel] .szaj-ny{display:inline;transform-origin:50% 50%;animation:szaj .28s infinite}
.csira[data-a=alszik] .szem-alszik,.csira[data-a=alszik] .zzz{display:inline}.csira[data-a=alszik] .zzz{animation:zz 2.2s infinite}
.csira[data-a=gondol] .gondol{display:inline;animation:zz 1.6s infinite}
.buborek{background:var(--kartya);border:2px solid var(--vonal);border-radius:16px;border-bottom-left-radius:4px;padding:8px 12px;font-weight:700;font-size:.95rem;animation:pop2 .3s both;min-height:38px}
.szikra{position:fixed;z-index:60;pointer-events:none;font-size:1.3rem;animation:repul .8s ease-out forwards}
.hangvezer{display:flex;gap:8px;margin-top:14px}
.hangvezer .gomb{padding:10px 14px;font-size:.95rem}
.lap{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:70;display:grid;place-items:end center;animation:belep .2s both}
.lap>div{background:var(--bg);border:1px solid var(--vonal);border-radius:22px 22px 0 0;width:100%;max-width:760px;padding:16px 16px 28px;max-height:85vh;overflow:auto}
.tanfolyamok{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 10px;margin:0 -14px;padding-left:14px;padding-right:14px;scrollbar-width:thin}
.tanfolyamok>.tk{flex:0 0 84%;scroll-snap-align:center;margin:0}
.tk{border-top:5px solid var(--ac,var(--zold));display:flex;flex-direction:column;gap:8px}
.tk .gyuru{background:conic-gradient(var(--ac) calc(var(--p)*1%),var(--kartya2) 0)}
.tk .gomb.ac{background:var(--ac);border-bottom-color:color-mix(in srgb,var(--ac) 60%,#000);margin-top:auto}
.ujkartya{border-style:dashed;border-top-style:dashed;align-items:center;justify-content:center;text-align:center;min-height:170px;opacity:.85}
.hetcsik{display:flex;gap:5px}.hp{flex:1;text-align:center;font-size:.72rem;font-weight:800;border-radius:8px;padding:3px 0;background:var(--kartya2);color:var(--halvany)}
.hp.t{outline:2px dashed var(--ac);outline-offset:-2px;color:var(--szoveg)}.hp.k{background:var(--ac);color:#06210f}.hp.m{box-shadow:0 0 0 2px var(--szoveg)}
@media(min-width:700px){#app.szeles{max-width:1100px}.tanfolyamok{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));overflow:visible;margin:0;padding:4px 0}.tanfolyamok>.tk{flex:none}}
@keyframes rec{0%,100%{box-shadow:0 0 0 0 rgba(255,93,93,.6)}50%{box-shadow:0 0 0 16px rgba(255,93,93,0)}}
.hang.rec{animation:rec 1s infinite}
.szo.ures{background:transparent;border-style:dashed;border-color:var(--vonal);color:transparent;box-shadow:none;cursor:default}
.szo.ujszo{animation:pop2 .22s both}
/* ---------- szemléltető ábrák ---------- */
@keyframes nov{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes kor{from{transform:rotate(0)}to{transform:rotate(var(--a))}}
.abra{background:var(--kartya);border:1px solid var(--vonal);border-radius:16px;padding:10px;margin:12px 0;animation:pop2 .4s both}
.abracim{font-weight:800;margin:0 2px 8px;font-size:.95rem}
.abra svg{width:100%;height:auto;display:block;border-radius:12px}
.abra .jel{animation:pop2 .5s both;animation-delay:calc(var(--i)*.13s);transform-box:fill-box;transform-origin:center;cursor:pointer}
.abra .jel .em{animation:lebeg2 3.2s ease-in-out infinite;animation-delay:calc(var(--i)*.45s);transform-box:fill-box;transform-origin:center}
.abra .jel:active{transform:scale(1.18)}
.abra .oszlop{transform-box:fill-box;transform-origin:bottom;animation:nov .7s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i)*.09s)}
.abra .szelet{animation:pop2 .6s both;animation-delay:calc(var(--i)*.1s);transform-box:fill-box;transform-origin:center}
.abra .csomo{animation:pop2 .5s both;animation-delay:calc(var(--i)*.1s + .2s);transform-box:fill-box;transform-origin:center}
.abra .mutato{transform-origin:50px 50px;animation:kor 1.4s cubic-bezier(.3,1.3,.5,1) both;transform:rotate(var(--a))}
.fl{display:flex;flex-direction:column;align-items:stretch;gap:4px}
.fl-lep{display:flex;align-items:center;gap:10px;background:var(--kartya2);border-radius:14px;padding:9px 12px;font-weight:600;animation:pop2 .45s both;animation-delay:calc(var(--i)*.15s)}
.fl-ikon{font-size:1.5rem;flex:none;width:2.1rem;text-align:center}
.fl-nyil{text-align:center;color:var(--zold);font-weight:900;line-height:1;animation:pop2 .4s both;animation-delay:calc(var(--i)*.15s + .1s)}
.iv{position:relative;padding-left:26px}
.iv::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:3px;border-radius:3px;background:linear-gradient(var(--zold),var(--kek))}
.iv-p{position:relative;margin:0 0 10px;animation:pop2 .45s both;animation-delay:calc(var(--i)*.14s)}
.iv-p::before{content:"";position:absolute;left:-23px;top:4px;width:13px;height:13px;border-radius:50%;background:var(--kartya);border:3px solid var(--zold)}
.iv-p b{display:block}.iv-p .ik{margin-right:4px}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;position:relative}
.vs>div{background:var(--kartya2);border-radius:14px;padding:10px;animation:pop2 .45s both}
.vs>div:nth-child(2){animation-delay:.12s}
.vs h4{margin:0 0 6px;padding:4px 8px;border-radius:9px;color:var(--gomb-sz);font-size:.9rem;text-align:center}
.vs ul{margin:0;padding-left:1.1em;font-size:.92rem}
.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:.92rem;overflow:hidden;border-radius:12px;border:1px solid var(--vonal)}
.tbl th{background:var(--zold);color:var(--gomb-sz);padding:7px 8px;text-align:left}
.tbl td{padding:7px 8px;border-top:1px solid var(--vonal)}.tbl tr:nth-child(even) td{background:var(--kartya2)}
.legenda{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:8px;font-size:.85rem}
.legenda i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tippabra{font-size:.82rem;color:var(--halvany);margin:-4px 2px 6px}
.par.tipp{border-color:var(--arany);animation:jopuls .7s 3;background:color-mix(in srgb,var(--arany) 18%,var(--kartya))}
.profilok{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin:16px 0}
.profil{background:var(--kartya);border:2px solid var(--vonal);border-bottom-width:4px;border-radius:16px;padding:14px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;animation:pop2 .4s both}
.profil .pe{font-size:2.3rem}.profil:active{transform:translateY(2px)}
.miniappablak{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.miniapptet{display:flex;align-items:center;gap:10px;padding:10px 14px}
.miniappablak iframe{flex:1;border:0;width:100%;background:#fff}
.tablabe{max-width:420px;margin:0 auto}.tablabe .sakk{width:100%;height:auto;display:block;border-radius:10px;color:var(--szoveg)}

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const md=t=>{let h=esc(t).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>").replace(/\*([^*\n]+?)\*/g,"<em>$1</em>");
  const sorok=h.split(/\n/);let o="",lista=false;
  for(const s of sorok){if(/^\s*[-•*]\s+/.test(s)){if(!lista){o+="<ul>";lista=true}o+="<li>"+s.replace(/^\s*[-•*]\s+/,"")+"</li>"}else{if(lista){o+="</ul>";lista=false}if(s.trim())o+="<p>"+s+"</p>"}}
  return o+(lista?"</ul>":"")};
const api=async(u,b)=>{const r=await fetch(u,b===undefined?{}:{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
  const j=await r.json().catch(()=>({hiba:"Hálózati hiba"}));if(r.status===401){j._401=true;belepes()}else if(!r.ok&&!j.hiba)j.hiba="Hiba ("+r.status+")";return j};
let A=null;
const Be=Object.assign({kabala:"dino",sfx:true,auto:true,nemit:false,motor:"auto",seb:1,huHang:"anna",enHang:"lessac",bHu:"",bEn:"",emlekezteto:{be:false,ido:"18:00"}},JSON.parse(localStorage.tanoda_be||"{}"));
document.documentElement.dataset.kabala=Be.kabala==="lapi"?"lapi":"dino";
const KNEV=()=>Be.kabala==="lapi"?"Lapi":"Rexi";
const mentBe=()=>{localStorage.tanoda_be=JSON.stringify(Be);fetch("/api/beallitas",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(Be)}).catch(()=>{})};
/* ---------- hanghatások (szintetizált, nincs hangfájl) ---------- */
const sfx=(()=>{let ac=null;
  const ctx=()=>{if(!Be.sfx)return null;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==="suspended")ac.resume();return ac}catch(e){return null}};
  const N=n=>261.63*Math.pow(2,n/12);
  const ton=(f,d,o={})=>{const c=ctx();if(!c)return;const {tip="sine",v=.14,t=0,f2=null,lp=null}=o,x=c.createOscillator(),g=c.createGain(),s=c.currentTime+t;
    x.type=tip;x.frequency.setValueAtTime(f,s);if(f2)x.frequency.exponentialRampToValueAtTime(f2,s+d);
    g.gain.setValueAtTime(.0001,s);g.gain.exponentialRampToValueAtTime(v,s+.012);g.gain.exponentialRampToValueAtTime(.0001,s+d);
    let n=x;if(lp){const q=c.createBiquadFilter();q.type="lowpass";q.frequency.value=lp;x.connect(q);n=q}n.connect(g);g.connect(c.destination);x.start(s);x.stop(s+d+.05)};
  return {tap:()=>ton(900,.05,{v:.04,tip:"triangle"}),
    jo:()=>{ton(N(7),.12,{tip:"triangle"});ton(N(12),.2,{tip:"triangle",t:.09});ton(N(19),.28,{v:.05,t:.17})},
    rossz:()=>ton(230,.32,{tip:"sawtooth",v:.08,f2:130,lp:700}),
    par:()=>ton(520,.1,{f2:1040,v:.11}),flip:()=>ton(300,.12,{f2:720,tip:"triangle",v:.1}),
    lapoz:()=>ton(380,.1,{f2:560,v:.06,tip:"triangle"}),
    kombo:n=>{for(let i=0;i<Math.min(4,n-1);i++)ton(N(12+i*2),.1,{tip:"square",v:.04,t:i*.06})},
    kezdes:()=>{ton(200,.35,{f2:900,v:.07});ton(N(12),.22,{tip:"triangle",t:.3})},
    szint:()=>[0,4,7,12,16,19,24].forEach((n,i)=>ton(N(n),.3,{tip:"triangle",t:i*.1,v:.12})),
    kituzo:()=>{ton(N(19),.6,{v:.12});ton(N(19)*2,.5,{v:.05});ton(N(24),.7,{t:.15,v:.1})},
    vege:()=>[0,4,7,12].forEach((n,i)=>ton(N(n),.26,{tip:"triangle",t:i*.12,v:.14}))}})();
const joHang=()=>sfx.jo(),rosszHang=()=>sfx.rossz(),gyozelem=()=>sfx.vege();
document.addEventListener("pointerdown",e=>{if(e.target.closest("button,.opcio,.par,.szo,.kartya[onclick]"))sfx.tap()});
const rez=ms=>navigator.vibrate&&navigator.vibrate(ms);
/* ---------- Lapi, a 3D kabala (SVG-tartalék, ha nincs WebGL) ---------- */
const CSIRA=(k="",a="idle")=>`<div class="csira ${k}" data-a="${a}"><svg viewBox="0 0 100 100"><ellipse cx="50" cy="94" rx="26" ry="5" fill="rgba(0,0,0,.18)"/>
<g class="test2"><g class="level"><path d="M50 28C46 10 32 6 24 10C26 22 36 29 50 28Z" fill="#37d66f"/><path d="M50 28C54 8 70 4 78 9C76 22 64 29 50 28Z" fill="#22b85c"/><path d="M50 30L50 20" stroke="#168a45" stroke-width="3" stroke-linecap="round"/></g>
<ellipse cx="50" cy="62" rx="33" ry="30" fill="#4be08a"/><ellipse cx="50" cy="71" rx="22" ry="17" fill="#b4f7cd" opacity=".7"/>
<ellipse cx="31" cy="68" rx="6" ry="4" fill="#ff9fb8" opacity=".8"/><ellipse cx="69" cy="68" rx="6" ry="4" fill="#ff9fb8" opacity=".8"/>
<g class="szem"><ellipse cx="38" cy="56" rx="6" ry="7.5" fill="#12301f"/><ellipse cx="62" cy="56" rx="6" ry="7.5" fill="#12301f"/><circle cx="40" cy="53" r="2.4" fill="#fff"/><circle cx="64" cy="53" r="2.4" fill="#fff"/></g>
<g class="szem-orul" fill="none" stroke="#12301f" stroke-width="3.5" stroke-linecap="round"><path d="M32 58Q38 49 44 58"/><path d="M56 58Q62 49 68 58"/></g>
<g class="szem-szomoru"><ellipse cx="38" cy="59" rx="5.5" ry="6" fill="#12301f"/><ellipse cx="62" cy="59" rx="5.5" ry="6" fill="#12301f"/><circle cx="39.5" cy="57" r="2" fill="#fff"/><circle cx="63.5" cy="57" r="2" fill="#fff"/><path d="M30 51L44 46M70 51L56 46" stroke="#12301f" stroke-width="3" stroke-linecap="round"/></g>
<g class="szem-alszik" fill="none" stroke="#12301f" stroke-width="3.5" stroke-linecap="round"><path d="M32 58Q38 63 44 58"/><path d="M56 58Q62 63 68 58"/></g>
<path class="szaj" d="M43 71Q50 78 57 71" fill="none" stroke="#12301f" stroke-width="3.2" stroke-linecap="round"/>
<path class="szaj-orul" d="M40 69Q50 84 60 69Z" fill="#12301f"/><ellipse class="szaj-ny" cx="50" cy="73" rx="6" ry="4" fill="#12301f"/>
<path class="szaj-szomoru" d="M43 77Q50 70 57 77" fill="none" stroke="#12301f" stroke-width="3.2" stroke-linecap="round"/>
<text class="zzz" x="70" y="38" font-size="16" fill="#93b0a0" font-weight="800">z</text><text class="gondol" x="70" y="34" font-size="16" fill="#93b0a0" font-weight="800">…</text></g></svg></div>`;
function csiraA(allapot,ms=0){document.querySelectorAll(".csira").forEach(e=>{e.dataset.a="idle";void e.offsetWidth;e.dataset.a=allapot;e.dataset.n=String(performance.now())});
  if(ms)setTimeout(()=>document.querySelectorAll(".csira").forEach(e=>{if(e.dataset.a===allapot)e.dataset.a=Felolv.beszel?"beszel":"idle"}),ms)}
/* A kabala gesztusai a tanulás mozzanataihoz: több változat közül sorsol, a szintre/sorozatra/nehézségre is figyel */
const KAB_ESEMENY={
  koszon:[["integet",2200],["integet",2200],["nyujtozik",2200]],
  lecke_indul:[["integet",1800],["bator",1600]],
  helyes:[["orul",900],["bolint",900],["tapsol",1100]],
  sorozat3:[["tapsol",1300],["bator",1400],["orul",1000]],
  sorozat5:[["tancol",1800],["edz",1600]],
  sorozat8:[["forog",1700],["tancol",2000]],
  hibas:[["szomoru",900],["razza",1100]],
  hibas2:[["bator",1500],["tanit",1500]],
  nehez:[["edz",1500],["csodalkozik",1200]],
  gyors:[["fut",1400]],
  kesz_jo:[["tancol",2600],["forog",1800]],
  kesz_tokeletes:[["forog",1800],["tancol",3000]],
  uj_szint:[["forog",1900],["szalutal",2200]],
  kituzo:[["csodalkozik",1500],["szalutal",2000]],
  sorozat_nap:[["szalutal",2200],["edz",1800]],
};
function kabala(esemeny){const l=KAB_ESEMENY[esemeny];if(!l)return;const [a,ms]=l[Math.random()*l.length|0];csiraA(a,ms)}
function buborek(t){const b=$("#bub");if(b){b.textContent=t;b.style.animation="none";void b.offsetWidth;b.style.animation=""}}
const veletlen=l=>l[Math.random()*l.length|0];
function szikra(x,y,n=10,jelek=["✨","⭐","💚","🌟"]){for(let i=0;i<n;i++){const e=document.createElement("span");e.className="szikra";e.textContent=veletlen(jelek);const a=Math.random()*6.28,r=40+Math.random()*70;
  e.style.cssText=`left:${x}px;top:${y}px;--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r-30}px;--r:${(Math.random()*180-90)|0}deg`;document.body.appendChild(e);setTimeout(()=>e.remove(),900)}}
const szikraEl=(el,n)=>{if(!el)return;const r=el.getBoundingClientRect();szikra(r.left+r.width/2,r.top+r.height/2,n)};
/* ---------- felolvasás: böngésző természetes hangja, különben a Tanoda saját (Anna) hangja ---------- */
const NYELV_BCP={en:"en-US",de:"de-DE",fr:"fr-FR",es:"es-ES",it:"it-IT",pt:"pt-PT",nl:"nl-NL",pl:"pl-PL",ru:"ru-RU",uk:"uk-UA",cs:"cs-CZ",sk:"sk-SK",ro:"ro-RO",sv:"sv-SE",no:"nb-NO",da:"da-DK",fi:"fi-FI",tr:"tr-TR",el:"el-GR",ar:"ar-SA",zh:"zh-CN",ja:"ja-JP",ko:"ko-KR",hi:"hi-IN",ca:"ca-ES"};
const vhang=l=>l==="en"?Be.enHang:l==="hu"?Be.huHang:"";
const Felolv={gen:0,aud:null,beszel:false,
  hangok(){try{return speechSynthesis.getVoices()||[]}catch(e){return[]}},
  bhang(l){const v=this.hangok().filter(x=>x.lang.toLowerCase().replace("_","-").startsWith(l)),v0=v.find(x=>x.name===(l==="en"?Be.bEn:l==="hu"?Be.bHu:"~"));if(v0)return v0;return v.find(x=>/natural|online|neural/i.test(x.name))||v.find(x=>/google|premium|enhanced/i.test(x.name))||v[0]||null},
  motor(){if(Be.motor==="szerver")return"s";const h=this.bhang("hu");if(Be.motor==="bongeszo")return h?"b":"s";return h&&/natural|online|neural|google|premium|enhanced/i.test(h.name)?"b":"s"},
  stop(){this.gen++;if(this.aud){this.aud.pause();this.aud=null}try{speechSynthesis.cancel()}catch(e){}this.beszel=false;csiraA("idle")},
  async mond(szegs,motor){this.stop();const g=this.gen,m=motor||this.motor();this.beszel=true;csiraA("beszel");
    for(let i=0;i<szegs.length&&g===this.gen;i++){const sz=szegs[i];
      if(m==="s"&&szegs[i+1])fetch(`/api/tts?h=${szegs[i+1].l}&v=${vhang(szegs[i+1].l)}&t=${encodeURIComponent(szegs[i+1].t)}`).catch(()=>{});
      const ok=await (m==="b"?this.b(sz,g):this.s(sz,g));if(ok===false){const v=this.vege;this.stop();v&&v();toast("A böngésző nem engedte a hangot – koppints a 🔊 gombra.");return}}
    if(g===this.gen){this.beszel=false;csiraA("idle");Felolv.vege&&Felolv.vege()}},
  s(sz,g){return new Promise(res=>{const a=new Audio(`/api/tts?h=${sz.l}&v=${vhang(sz.l)}&t=${encodeURIComponent(sz.t)}`);a.playbackRate=Be.seb;this.aud=a;a.onended=()=>res(true);a.onerror=()=>{if(g!==this.gen)return res(true);this.b(sz,g).then(res)};
    a.play().catch(()=>res(false))})},
  b(sz,g){return new Promise(res=>{const u=new SpeechSynthesisUtterance(sz.t),h=this.bhang(sz.l);u.lang=sz.l==="hu"?"hu-HU":(NYELV_BCP[sz.l]||sz.l);if(h)u.voice=h;u.rate=Be.seb;u.pitch=1.05;
    u.onend=()=>res(true);u.onerror=()=>res(true);speechSynthesis.speak(u)})}};
try{speechSynthesis.onvoiceschanged=()=>{}}catch(e){}
const ech=(v,fel)=>`<button class="valaszt ${Be.emlekezteto.be===v?"be":""}" onclick="Be.emlekezteto.be=${v};Be.emlekezteto.ido=document.getElementById('eido').value||Be.emlekezteto.ido;mentBe();this.parentNode.querySelectorAll('.valaszt').forEach(x=>x.classList.remove('be'));this.classList.add('be')">${fel}</button>`;

   <div class="profilok">${(r.profilok||[]).map(p=>`<button class="profil" onclick="profilValaszt('${esc(p.az)}',${p.pin})"><span class="pe">${esc(p.emoji)}</span><b>${esc(p.nev)}</b>${p.pin?'<span class="halvany">🔒</span>':""}</button>`).join("")}
   <button class="profil" onclick="ujProfil()"><span class="pe">＋</span><b>Új profil</b></button></div>`}
document.addEventListener("input",e=>{const i=e.target;if(i.tagName==="INPUT"&&(i.inputMode==="numeric"||i.type==="number")){const v=szam0(i.value);if(v!==i.value&&/^\d+$/.test(i.value))i.value=v}});

async function profilValaszt(az,pin){let p="";if(pin){p=prompt("A profil PIN-kódja:");if(p===null)return;p=szam0(p.trim())}

   <label>PIN-kód <span class="halvany">(opcionális, 4–8 számjegy – ha mások nem nézhetik a haladásodat)</span></label><input id="pf_pin" type="password" inputmode="numeric" maxlength="8" autocomplete="off">
   <div style="height:16px"></div><button class="gomb" onclick="profilLetrehoz()">Kezdjünk! 🚀</button>`;setTimeout(()=>$("#pf_nev").focus(),50)}

const kch=(v,fel)=>`<button class="valaszt ${Be.kabala===v?"be":""}" onclick="Be.kabala='${v}';document.documentElement.dataset.kabala='${v}';mentBe();this.parentNode.querySelectorAll('.valaszt').forEach(x=>x.classList.remove('be'));this.classList.add('be');csiraA('orul',1200)">${fel}</button>`;

   <div class="sor" style="gap:8px"><button class="gomb masodlagos" style="padding:9px 12px;font-size:.92rem" onclick="profilValtas()">↔ Profilváltás</button><button class="gomb masodlagos" style="padding:9px 12px;font-size:.92rem" onclick="this.closest('.lap').remove();visszajelzesNyit()">💬 Visszajelzés</button><button class="gomb masodlagos" style="padding:9px 12px;font-size:.92rem" onclick="pinBeallit()">${f.pin?"🔒 PIN módosítása":"🔓 PIN beállítása"}</button></div>
   <div class="halvany" style="margin:6px 0 4px">Másik eszközről (ugyanazon a Wi-Fin) ezen a címen érhető el: <b>${esc(A.lan||"")}</b></div>`:"";
  d.innerHTML=`<div><h3>⚙️ Beállítások</h3>${prof}
   <label>🦖 Kabala</label><div class="chipsor">${kch("dino","🦖 Rexi, a dínó")}${kch("lapi","📚 Lapi, a könyv")}</div>

   <label>Felolvasó forrása</label><div class="chipsor">${ch("motor","auto","Automatikus")}${ch("motor","szerver","A Tanoda hangjai")}${ch("motor","bongeszo","Az eszköz hangja")}</div>
